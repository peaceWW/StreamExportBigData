spring:
  application:
    name: common-export-service
  profiles:
    active: local
  cloud:
    nacos:
      config:
        file-extension: yml
        shared-configs[0]:
          data-id: common.yml
          refresh: true
  main:
    allow-bean-definition-overriding: true

server:
  port: 8005
  servlet:
    context-path: /api/export/
management:
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'

mybatis:
  type-aliases-package: cn.sdpjw.export.entity
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
